name: generate-taginfo
on:
    push:
    workflow_dispatch:
    schedule:
        - cron: '0 7 * * Mon'
permissions:
    contents: write
jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
          - name: checkout repo content
            uses: actions/checkout@v7
          - name: setup python
            uses: actions/setup-python@v7
            with:
              python-version: '3.13'
          - run: python -m pip install -r requirements.txt
          - name: test PBF frequency counting
            run: python -m unittest discover -s tests -v
          - name: download Geofabrik Germany extract
            run: |
              curl --fail --location --retry 5 --retry-delay 10 --retry-max-time 3600 \
                --connect-timeout 30 --max-time 3600 \
                --output "$RUNNER_TEMP/germany-latest.osm.pbf.part" \
                https://download.geofabrik.de/europe/germany-latest.osm.pbf
              mv "$RUNNER_TEMP/germany-latest.osm.pbf.part" "$RUNNER_TEMP/germany-latest.osm.pbf"
          - name: execute sorting script
            run: python scripts/sort-values.py "$RUNNER_TEMP/germany-latest.osm.pbf"
          - name: execute readme script
            run: python scripts/generate-readme.py
          - name: execute taginfo script
            run: python scripts/generate-taginfo.py
          - name: commit and push generated files
            if: github.ref == 'refs/heads/main'
            run: |
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add definitions/signs.json signs.md taginfo.json
              if git diff --cached --quiet; then
                echo "No generated files changed."
                exit 0
              fi
              git commit -m "auto-update definitions, readme and taginfo"
              git push origin HEAD:main
